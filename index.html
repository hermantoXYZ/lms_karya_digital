<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LMS Sekolah Digital - Portal Pembelajaran Terpadu</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #f8fafc;
    }
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
    .fade-in {
      animation: fadeIn 0.25s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="text-slate-800 antialiased selection:bg-blue-600 selection:text-white">

  <!-- ==========================================
       1. HALAMAN LOGIN (PORTAL MASUK)
       ========================================== -->
  <div id="login-screen" class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-slate-900 via-blue-950 to-slate-900">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl overflow-hidden fade-in">
      <!-- Header Login -->
      <div class="bg-blue-600 p-6 text-white text-center relative overflow-hidden">
        <div class="w-14 h-14 bg-white/15 backdrop-blur-sm rounded-xl flex items-center justify-center mx-auto mb-3 border border-white/20">
          <i data-lucide="graduation-cap" class="w-8 h-8 text-white"></i>
        </div>
        <h1 class="text-xl font-bold tracking-tight">LMS SEKOLAH DIGITAL</h1>
        <p class="text-blue-100 text-xs mt-1">Sistem Manajemen Pembelajaran & Evaluasi Terpadu</p>
      </div>

      <!-- Form Login -->
      <form id="login-form" class="p-6 space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Masuk Sebagai (Simulasi Role)</label>
          <div class="grid grid-cols-3 gap-2">
            <button type="button" onclick="selectRole('siswa')" id="btn-role-siswa" class="role-btn py-2 px-3 rounded-lg border-2 border-blue-600 bg-blue-50 text-blue-700 font-semibold text-xs flex flex-col items-center gap-1 transition">
              <i data-lucide="user" class="w-4 h-4"></i> Siswa
            </button>
            <button type="button" onclick="selectRole('guru')" id="btn-role-guru" class="role-btn py-2 px-3 rounded-lg border border-slate-200 bg-white text-slate-600 hover:bg-slate-50 font-semibold text-xs flex flex-col items-center gap-1 transition">
              <i data-lucide="book-open-check" class="w-4 h-4"></i> Guru
            </button>
            <button type="button" onclick="selectRole('admin')" id="btn-role-admin" class="role-btn py-2 px-3 rounded-lg border border-slate-200 bg-white text-slate-600 hover:bg-slate-50 font-semibold text-xs flex flex-col items-center gap-1 transition">
              <i data-lucide="shield-check" class="w-4 h-4"></i> Admin
            </button>
          </div>
        </div>

        <div>
          <label for="username" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">NIS / NIP / Username</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
              <i data-lucide="id-card" class="w-4 h-4"></i>
            </span>
            <input type="text" id="username" value="20261001" required
              class="w-full pl-10 pr-4 py-2.5 text-sm border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
              placeholder="Masukkan NIS, NIP, atau Username" />
          </div>
        </div>

        <div>
          <label for="password" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Kata Sandi</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
              <i data-lucide="lock" class="w-4 h-4"></i>
            </span>
            <input type="password" id="password" value="••••••••" required
              class="w-full pl-10 pr-4 py-2.5 text-sm border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
              placeholder="Masukkan kata sandi" />
          </div>
        </div>

        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 px-4 rounded-xl shadow-md shadow-blue-600/20 transition flex items-center justify-center gap-2">
          <span>Masuk ke Portal</span>
          <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </button>

        <p class="text-center text-xs text-slate-400 pt-2">
          Siap dihubungkan dengan Google Apps Script API
        </p>
      </form>
    </div>
  </div>

  <!-- ==========================================
       2. APLIKASI UTAMA (DASHBOARD LMS)
       ========================================== -->
  <div id="app-shell" class="hidden min-h-screen flex flex-col lg:flex-row">
    
    <!-- Mobile Sidebar Overlay -->
    <div id="sidebar-backdrop" onclick="toggleSidebar()" class="fixed inset-0 bg-slate-900/50 z-30 hidden lg:hidden backdrop-blur-xs"></div>

    <!-- SIDEBAR NAVIGASI -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-64 bg-slate-900 text-slate-300 transform -translate-x-full lg:translate-x-0 lg:static lg:inset-0 transition-transform duration-200 ease-in-out flex flex-col">
      <!-- Brand -->
      <div class="h-16 flex items-center justify-between px-5 border-b border-slate-800">
        <div class="flex items-center gap-2.5 text-white font-bold text-base">
          <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center">
            <i data-lucide="graduation-cap" class="w-5 h-5"></i>
          </div>
          <span>LMS Sekolah</span>
        </div>
        <button onclick="toggleSidebar()" class="lg:hidden text-slate-400 hover:text-white">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Info Role Aktif -->
      <div class="p-4 border-b border-slate-800/80">
        <div class="bg-slate-800/70 rounded-xl p-3 flex items-center gap-3">
          <div id="sidebar-avatar" class="w-10 h-10 rounded-full bg-blue-600 text-white font-bold flex items-center justify-center text-sm shrink-0">
            SW
          </div>
          <div class="overflow-hidden">
            <p id="sidebar-name" class="text-sm font-semibold text-white truncate">Ahmad Fauzan</p>
            <span id="sidebar-role-badge" class="inline-block text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded bg-blue-500/20 text-blue-300 mt-0.5">
              Siswa • XII IPA 1
            </span>
          </div>
        </div>
      </div>

      <!-- Menu Navigasi Dinamis (Diisi via JS sesuai Role) -->
      <nav id="sidebar-nav" class="flex-1 px-3 py-4 space-y-1 overflow-y-auto">
        <!-- Menu items rendered by JS -->
      </nav>

      <!-- Footer Sidebar -->
      <div class="p-4 border-t border-slate-800">
        <button onclick="logout()" class="w-full flex items-center gap-3 px-3 py-2.5 text-sm font-medium text-rose-400 hover:bg-rose-500/10 rounded-xl transition">
          <i data-lucide="log-out" class="w-4 h-4"></i>
          <span>Keluar Aplikasi</span>
        </button>
      </div>
    </aside>

    <!-- KONTEN UTAMA -->
    <div class="flex-1 flex flex-col min-w-0">
      
      <!-- TOP NAVBAR -->
      <header class="h-16 bg-white border-b border-slate-200 px-4 lg:px-8 flex items-center justify-between sticky top-0 z-20">
        <div class="flex items-center gap-3">
          <button onclick="toggleSidebar()" class="lg:hidden p-2 rounded-lg text-slate-600 hover:bg-slate-100">
            <i data-lucide="menu" class="w-5 h-5"></i>
          </button>
          <div>
            <h2 id="page-title" class="text-base lg:text-lg font-bold text-slate-800">Beranda</h2>
            <p id="page-subtitle" class="text-xs text-slate-500 hidden sm:block">Ringkasan aktivitas akademik dan pembelajaran hari ini</p>
          </div>
        </div>

        <div class="flex items-center gap-3">
          <!-- Switch Role Cepat (Untuk Demo) -->
          <div class="hidden md:flex items-center bg-slate-100 p-1 rounded-lg text-xs">
            <span class="px-2 text-slate-500 font-medium">Mode Demo:</span>
            <button onclick="switchDemoRole('siswa')" class="px-2.5 py-1 rounded-md font-semibold transition demo-pill" data-role="siswa">Siswa</button>
            <button onclick="switchDemoRole('guru')" class="px-2.5 py-1 rounded-md font-semibold transition demo-pill" data-role="guru">Guru</button>
            <button onclick="switchDemoRole('admin')" class="px-2.5 py-1 rounded-md font-semibold transition demo-pill" data-role="admin">Admin</button>
          </div>

          <button class="p-2 text-slate-500 hover:bg-slate-100 rounded-full relative">
            <i data-lucide="bell" class="w-5 h-5"></i>
            <span class="w-2 h-2 bg-rose-500 rounded-full absolute top-2 right-2"></span>
          </button>
        </div>
      </header>

      <!-- AREA KONTEN DINAMIS -->
      <main id="main-content" class="flex-1 p-4 lg:p-8 max-w-7xl w-full mx-auto fade-in">
        <!-- Konten halaman dirender di sini -->
      </main>

    </div>
  </div>

  <!-- ==========================================
       3. MODAL TAMBAH MATERI / SOAL (UNTUK GURU/ADMIN)
       ========================================== -->
  <div id="modal-form" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-xl fade-in">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100">
        <h3 id="modal-title" class="font-bold text-slate-800">Tambah Materi Baru</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <form onsubmit="handleSaveModal(event)" class="mt-4 space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Judul Materi / Topik</label>
          <input type="text" required placeholder="Contoh: Pengantar Algoritma & Pemrograman" class="w-full px-3.5 py-2 text-sm border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Kelas & Jurusan</label>
            <select class="w-full px-3.5 py-2 text-sm border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
              <option>XII IPA 1</option>
              <option>XII IPA 2</option>
              <option>XI IPS 1</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Mata Pelajaran</label>
            <select class="w-full px-3.5 py-2 text-sm border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
              <option>Informatika</option>
              <option>Ekonomi</option>
              <option>Matematika</option>
            </select>
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Ringkasan / Tautan Dokumen (Drive/Video)</label>
          <textarea rows="3" required placeholder="Tuliskan deskripsi singkat atau tempel tautan materi..." class="w-full px-3.5 py-2 text-sm border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
        </div>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="closeModal()" class="px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-xl">Batal</button>
          <button type="submit" class="px-4 py-2 text-sm font-semibold text-white bg-blue-600 hover:bg-blue-700 rounded-xl">Simpan Data</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ==========================================
       JAVASCRIPT LOGIC & DATA MOCKUP
       ========================================== -->
  <script>
    // Konfigurasi URL Backend Google Apps Script (Ganti saat integrasi API)
    const API_URL = "https://script.google.com/macros/s/YOUR_DEPLOYMENT_ID/exec";

    // State Aplikasi
    let currentRole = 'siswa';
    let currentTab = 'dashboard';

    // Data Profil Simulasi per Role
    const roleProfiles = {
      siswa: {
        name: "Ahmad Fauzan",
        badge: "Siswa • XII IPA 1",
        avatar: "AF",
        idInput: "20261001",
        menus: [
          { id: 'dashboard', label: 'Beranda', icon: 'layout-dashboard' },
          { id: 'materi', label: 'Materi Pelajaran', icon: 'book-open' },
          { id: 'ujian', label: 'Tugas & Ujian CBT', icon: 'file-check-2' },
          { id: 'nilai', label: 'Rekap Nilai', icon: 'award' }
        ]
      },
      guru: {
        name: "Budi Santoso, S.Pd.",
        badge: "Guru • Informatika",
        avatar: "BS",
        idInput: "19880412201503",
        menus: [
          { id: 'dashboard', label: 'Dashboard Guru', icon: 'layout-dashboard' },
          { id: 'materi', label: 'Kelola Materi', icon: 'folder-plus' },
          { id: 'ujian', label: 'Bank Soal & Ujian', icon: 'clipboard-list' },
          { id: 'nilai', label: 'Penilaian Siswa', icon: 'check-square' }
        ]
      },
      admin: {
        name: "Administrator Utama",
        badge: "Admin Sekolah",
        avatar: "AD",
        idInput: "admin_sekolah",
        menus: [
          { id: 'dashboard', label: 'Ringkasan Sistem', icon: 'layout-dashboard' },
          { id: 'users', label: 'Data Guru & Siswa', icon: 'users' },
          { id: 'kelas', label: 'Master Kelas & Jurusan', icon: 'layers' },
          { id: 'materi', label: 'Monitoring Materi', icon: 'database' }
        ]
      }
    };

    // Data Dummy Materi & Soal
    const sampleMateri = [
      { id: 1, mapel: "Informatika", judul: "Struktur Data & Algoritma Dasar", kelas: "XII IPA 1", guru: "Budi Santoso, S.Pd.", tanggal: "18 Nov 2026", tipe: "Modul PDF" },
      { id: 2, mapel: "Ekonomi", judul: "Kebijakan Moneter & Fiskal", kelas: "XII IPS 1", guru: "Siti Aminah, M.Si.", tanggal: "17 Nov 2026", tipe: "Video & Slide" },
      { id: 3, mapel: "Matematika", judul: "Integral Tentu dan Penerapannya", kelas: "XII IPA 1", guru: "Drs. Hendra Wijaya", tanggal: "15 Nov 2026", tipe: "Modul PDF" }
    ];

    const sampleSoal = [
      { id: 101, judul: "Evaluasi Harian 1: Logika Algoritma", mapel: "Informatika", durasi: "45 Menit", jumlah: "20 Soal", status: "Tersedia" },
      { id: 102, judul: "Kuis Pasar Modal & Inflasi", mapel: "Ekonomi", durasi: "30 Menit", jumlah: "15 Soal", status: "Selesai (Nilai: 92)" }
    ];

    // Inisialisasi Icon Lucide
    lucide.createIcons();

    // Pilih Role di Halaman Login
    function selectRole(role) {
      currentRole = role;
      document.getElementById('username').value = roleProfiles[role].idInput;
      
      document.querySelectorAll('.role-btn').forEach(btn => {
        btn.className = "role-btn py-2 px-3 rounded-lg border border-slate-200 bg-white text-slate-600 hover:bg-slate-50 font-semibold text-xs flex flex-col items-center gap-1 transition";
      });
      const activeBtn = document.getElementById(`btn-role-${role}`);
      activeBtn.className = "role-btn py-2 px-3 rounded-lg border-2 border-blue-600 bg-blue-50 text-blue-700 font-semibold text-xs flex flex-col items-center gap-1 transition";
    }

    // Handle Submit Login
    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();
      document.getElementById('login-screen').classList.add('hidden');
      document.getElementById('app-shell').classList.remove('hidden');
      initApp();
    });

    // Keluar Aplikasi
    function logout() {
      document.getElementById('app-shell').classList.add('hidden');
      document.getElementById('login-screen').classList.remove('hidden');
    }

    // Toggle Sidebar Mobile
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const backdrop = document.getElementById('sidebar-backdrop');
      sidebar.classList.toggle('-translate-x-full');
      backdrop.classList.toggle('hidden');
    }

    // Ganti Role Cepat dari Topbar Demo
    function switchDemoRole(role) {
      currentRole = role;
      currentTab = 'dashboard';
      initApp();
    }

    // Inisialisasi Tampilan Dashboard sesuai Role
    function initApp() {
      const profile = roleProfiles[currentRole];
      document.getElementById('sidebar-name').textContent = profile.name;
      document.getElementById('sidebar-role-badge').textContent = profile.badge;
      document.getElementById('sidebar-avatar').textContent = profile.avatar;

      // Update Demo Pills
      document.querySelectorAll('.demo-pill').forEach(pill => {
        if (pill.dataset.role === currentRole) {
          pill.className = "px-2.5 py-1 rounded-md font-semibold transition demo-pill bg-white text-blue-600 shadow-xs";
        } else {
          pill.className = "px-2.5 py-1 rounded-md font-semibold transition demo-pill text-slate-600 hover:text-slate-900";
        }
      });

      renderSidebarMenu();
      renderContent(currentTab);
    }

    // Render Menu Sidebar
    function renderSidebarMenu() {
      const nav = document.getElementById('sidebar-nav');
      const menus = roleProfiles[currentRole].menus;
      
      nav.innerHTML = menus.map(m => {
        const isActive = m.id === currentTab;
        const activeClass = isActive 
          ? "bg-blue-600 text-white shadow-md shadow-blue-600/20" 
          : "text-slate-300 hover:bg-slate-800 hover:text-white";
        return `
          <button onclick="navigateTo('${m.id}')" class="w-full flex items-center gap-3 px-3.5 py-2.5 text-sm font-medium rounded-xl transition ${activeClass}">
            <i data-lucide="${m.icon}" class="w-4 h-4"></i>
            <span>${m.label}</span>
          </button>
        `;
      }).join('');
      lucide.createIcons();
    }

    function navigateTo(tabId) {
      currentTab = tabId;
      renderSidebarMenu();
      renderContent(tabId);
      // Tutup sidebar otomatis di mode mobile
      if (window.innerWidth < 1024) {
        const sidebar = document.getElementById('sidebar');
        if (!sidebar.classList.contains('-translate-x-full')) {
          toggleSidebar();
        }
      }
    }

    // Render Konten Utama Berdasarkan Tab & Role
    function renderContent(tabId) {
      const main = document.getElementById('main-content');
      const titleEl = document.getElementById('page-title');
      const subEl = document.getElementById('page-subtitle');

      if (tabId === 'dashboard') {
        titleEl.textContent = "Beranda Utama";
        subEl.textContent = `Selamat datang kembali, ${roleProfiles[currentRole].name}`;
        
        main.innerHTML = `
          <!-- Statistik Ringkas -->
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
            <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-xs flex items-center gap-4">
              <div class="w-12 h-12 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center shrink-0">
                <i data-lucide="book-open" class="w-6 h-6"></i>
              </div>
              <div>
                <p class="text-xs font-medium text-slate-500">Total Materi Aktif</p>
                <p class="text-2xl font-bold text-slate-800">24</p>
              </div>
            </div>
            <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-xs flex items-center gap-4">
              <div class="w-12 h-12 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center shrink-0">
                <i data-lucide="file-check-2" class="w-6 h-6"></i>
              </div>
              <div>
                <p class="text-xs font-medium text-slate-500">Paket Soal / Ujian</p>
                <p class="text-2xl font-bold text-slate-800">8</p>
              </div>
            </div>
            <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-xs flex items-center gap-4">
              <div class="w-12 h-12 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center shrink-0">
                <i data-lucide="users" class="w-6 h-6"></i>
              </div>
              <div>
                <p class="text-xs font-medium text-slate-500">Kelas Terdaftar</p>
                <p class="text-2xl font-bold text-slate-800">12 Kelas</p>
              </div>
            </div>
            <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-xs flex items-center gap-4">
              <div class="w-12 h-12 rounded-xl bg-purple-50 text-purple-600 flex items-center justify-center shrink-0">
                <i data-lucide="trending-up" class="w-6 h-6"></i>
              </div>
              <div>
                <p class="text-xs font-medium text-slate-500">Rata-rata Evaluasi</p>
                <p class="text-2xl font-bold text-slate-800">86.5</p>
              </div>
            </div>
          </div>

          <!-- Grid Dua Kolom: Materi Terbaru & Jadwal Ujian -->
          <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 bg-white rounded-2xl border border-slate-200/80 shadow-xs overflow-hidden">
              <div class="p-5 border-b border-slate-100 flex items-center justify-between">
                <h3 class="font-bold text-slate-800 text-sm">Materi Pembelajaran Terbaru</h3>
                <button onclick="navigateTo('materi')" class="text-xs font-semibold text-blue-600 hover:underline">Lihat Semua</button>
              </div>
              <div class="divide-y divide-slate-100">
                ${sampleMateri.map(item => `
                  <div class="p-4 sm:px-5 flex flex-col sm:flex-row sm:items-center justify-between gap-3 hover:bg-slate-50/70 transition">
                    <div>
                      <span class="inline-block text-[11px] font-semibold px-2.5 py-0.5 rounded-md bg-blue-50 text-blue-700 mb-1">${item.mapel} • ${item.kelas}</span>
                      <h4 class="font-semibold text-slate-800 text-sm">${item.judul}</h4>
                      <p class="text-xs text-slate-500 mt-0.5">Oleh ${item.guru} • ${item.tanggal}</p>
                    </div>
                    <button onclick="navigateTo('materi')" class="self-start sm:self-center px-3 py-1.5 text-xs font-semibold bg-slate-100 hover:bg-blue-600 hover:text-white text-slate-700 rounded-lg transition shrink-0">
                      Buka Materi
                    </button>
                  </div>
                `).join('')}
              </div>
            </div>
